name: Build y Despliegue en GitHub Pages

on:
  schedule:
    # Previsión de precios de mañana: 14:51 UTC (15:51 CET invierno / 16:51 CEST verano) para compensar el retardo de colas (~4h 54m) y ejecutarse sobre las 20:45 PM
    - cron: '51 14 * * *'
    # Refresco matinal: 00:24 UTC (01:24 CET invierno / 02:24 CEST verano) para compensar el retardo de colas y estar listo sobre las 07:30 - 08:30 AM
    - cron: '24 0 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Descargar precios de la luz y compilar Astro
        run: npm run build

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
