<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="luzBgGlow" cx="50%" cy="44%" r="62%">
      <stop offset="0%" stop-color="#14293a" />
      <stop offset="55%" stop-color="#091423" />
      <stop offset="100%" stop-color="#030711" />
    </radialGradient>
    <linearGradient id="luzBorderGrad" x1="4" y1="32" x2="60" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.92" />
      <stop offset="48%" stop-color="#6ee7b7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="luzArcGrad" x1="12" y1="16" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="luzBoltMain" x1="26" y1="10" x2="36" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="28%" stop-color="#fde047" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="luzBoltEdge" x1="22" y1="10" x2="40" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="luzBoltShine" x1="28" y1="11" x2="25" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="luzWaveAmber" x1="30" y1="40" x2="54" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="luzWaveGreen" x1="10" y1="40" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Squircle Background & Dual Emerald/Amber Glowing Rim -->
  <rect width="64" height="64" rx="14.5" fill="url(#luzBgGlow)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.75" stroke="url(#luzBorderGrad)" stroke-width="1.5" />

  <!-- Outer & Inner Emerald Energy Gauge Arcs -->
  <path
    d="M27.5 12.2A20.2 20.2 0 0 0 22.8 50.2"
    stroke="url(#luzArcGrad)"
    stroke-width="2.2"
    stroke-linecap="round"
  />
  <path
    d="M39.5 13.4A20.2 20.2 0 0 1 32.5 52.2"
    stroke="url(#luzArcGrad)"
    stroke-width="1.8"
    stroke-linecap="round"
  />
  <path
    d="M26.5 15.2A17.2 17.2 0 0 0 23.5 47.2"
    stroke="#10b981"
    stroke-opacity="0.38"
    stroke-width="1.1"
    stroke-linecap="round"
  />
  <path
    d="M38.2 16.2A17.2 17.2 0 0 1 33.2 49.2"
    stroke="#10b981"
    stroke-opacity="0.38"
    stroke-width="1.1"
    stroke-linecap="round"
  />

  <!-- Hourly PVPC Frequency Pulse Waves (Left Emerald, Right Amber/Emerald) -->
  <path
    d="M9.5 40.8H16.5L18.8 38.2L21.2 44.5L23.8 34.5L26.2 42.5L28.5 39.5"
    stroke="url(#luzWaveGreen)"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M31.5 44.8L34.2 38.5L36.8 42.2L39.8 34.2L42.5 44.5L45.2 38.2L47.5 40.8H54.5"
    stroke="url(#luzWaveAmber)"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Volumetric Golden-Amber Lightning Bolt -->
  <path
    d="M30.8 10.2H39.8L33.4 27.2H43.6L25.4 55.2L30.4 33.8H21.8L30.8 10.2Z"
    fill="url(#luzBoltMain)"
    stroke="url(#luzBoltEdge)"
    stroke-width="1.3"
    stroke-linejoin="round"
  />

  <!-- Inner Beveled Facet & Specular Glass Highlight -->
  <path
    d="M31.6 11.8H37.8L31.8 27.6H27.2L23.8 32.2H31.8L27.5 50.2L41.2 28.8H32.2L31.6 11.8Z"
    fill="#d97706"
    fill-opacity="0.24"
  />
  <path
    d="M31.5 11.5H36.8L29.8 28.5L24.2 31.8L31.5 11.5Z"
    fill="url(#luzBoltShine)"
  />
</svg>
